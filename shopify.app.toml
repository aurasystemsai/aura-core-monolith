# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "98db68ecd4abcd07721d14949514de8a"
name = "AURA Systems – SEO Autopilot"
application_url = "https://aura-core-monolith.onrender.com/shopify"
embedded = true

[webhooks]
api_version = "2025-10"

  # GDPR mandatory webhooks — required for Shopify App Store approval
  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "/api/webhooks/customers/data-request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "/api/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "/api/webhooks/shop/redact"

[access_scopes]
# Scopes used by currently implemented Shopify product, content, order, customer,
# inventory, location, and metaobject integrations.
scopes = "read_products,write_products,read_content,write_content,read_orders,read_customers,read_inventory,read_locations,read_online_store_pages,read_themes,read_metaobjects,write_metaobjects,read_locales,read_translations,write_translations,read_discounts,write_discounts"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://aura-core-monolith.onrender.com/shopify/auth/callback",
  "https://aura-core-monolith.onrender.com/shopify/callback"
]

